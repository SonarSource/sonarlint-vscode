sonar.projectKey=org.sonarsource.sonarlint.vscode:sonarlint-vscode
sonar.sources=src,webview-ui,styles,build-sonarlint
sonar.tests=test,e2e/src
sonar.exclusions=test/**, build/**, out/**, out-cov/**, coverage/**, node_modules/**, **/node_modules/**, **/e2e/**, **/dogfood/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=webpack.config.js, scripts/**, build-sonarlint/**,
